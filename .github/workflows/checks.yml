#
# Run all checks on PRs and pushes
#
name: Checks

# Controls when the action will run.
on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches: [main, next, beta, alpha]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}_${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-lint:
    name: '▶️ actions'
    uses: atos-actions/actions/.github/workflows/lint-pr.yml@35635f5037ce1bcf6c05b31c95b8ff0ff0875e3e # v3.2.22
    permissions:
      contents: read
      pull-requests: write

  npm-lint:
    name: '▶️ actions'
    uses: atos-actions/actions/.github/workflows/lint-code.yml@35635f5037ce1bcf6c05b31c95b8ff0ff0875e3e # v3.2.22

  test:
    name: '▶📌'
    needs: [pr-lint, npm-lint]
    uses: ./.github/workflows/test.yml
